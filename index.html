<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SuperMashBruddas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #1e293b;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="2000" height="1100"></canvas>

    <!-- game engine -->
    <script type="text/javascript" src="drawing.js"></script>
    <script type="text/javascript" src="physics.js"></script>
    <script type="text/javascript" src="skin.js"></script>
    <script type="text/javascript" src="map.js"></script>
    <script type="text/javascript" src="attack.js"></script>
    <script type="text/javascript" src="player.js"></script>

    <!-- characters -->
    <script type="text/javascript" src="trump.js"></script>
    <script type="text/javascript" src="stoner.js"></script>
    <script type="text/javascript" src="faceman.js"></script>
    <script type="text/javascript" src="physics_knigh.js"></script>
    <script type="text/javascript" src="utopian.js"></script>
    <script type="text/javascript" src="shrek.js"></script>
    <script type="text/javascript" src="monke.js"></script>

    <!-- networking & state machine -->
    <script type="text/javascript" src="game.js"></script>
    <script type="text/javascript" src="network.js"></script>

    <!-- host UI rendering -->
    <script type="module">
        import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm"

        // Load character images from character_roster (game.js)
        const charImages = {}
        for (const [name, entry] of Object.entries(character_roster)) {
            const firstSkin = Object.values(entry.skins)[0]
            charImages[name] = firstSkin.image
        }

        let qrImg = null

        // === BOUNCING CHARACTERS FOR LOBBY ===
        const lobbyCharSize = 120
        let lobbyInitialized = false

        function initLobby() {
            if (lobbyInitialized) return
            lobbyInitialized = true

            all_objects = []

            // Walls using platform() — same as game maps
            const wallThickness = 50
            all_objects.push(platform(canvas.width, wallThickness, new Vector2(canvas.width / 2, -wallThickness / 2)))
            all_objects.push(platform(canvas.width, wallThickness, new Vector2(canvas.width / 2, canvas.height + wallThickness / 2)))
            all_objects.push(platform(wallThickness, canvas.height, new Vector2(-wallThickness / 2, canvas.height / 2)))
            all_objects.push(platform(wallThickness, canvas.height, new Vector2(canvas.width + wallThickness / 2, canvas.height / 2)))

            // QR code as solid platform
            const qr = getQrRect()
            all_objects.push(platform(qr.w, qr.h, new Vector2(qr.x + qr.w / 2, qr.y + qr.h / 2)))

            // Pick 5 random characters
            const allCharNames = Object.keys(charImages)
            const shuffled = allCharNames.sort(() => Math.random() - 0.5)
            const picked = shuffled.slice(0, 5)

            for (const name of picked) {
                const speed = 3 + Math.random() * 4
                const angle = Math.random() * Math.PI * 2
                const x = 200 + Math.random() * (canvas.width - 400)
                const y = 200 + Math.random() * (canvas.height - 400)

                const imgComp = new ImageComponent(charImages[name], new Vector2(0, 0), false)
                const obj = new GameObject(
                    new Vector2(x, y),
                    new PhysicalProperties(
                        new Vector2(Math.cos(angle) * speed, Math.sin(angle) * speed),
                        10, 0,
                        new Vector2(lobbyCharSize, lobbyCharSize),
                        1, false
                    ),
                    ["bouncer"],
                    { display: imgComp }
                )
                all_objects.push(obj)
            }
        }

        function getQrRect() {
            const qrSize = 350
            const cx = canvas.width / 2
            const cy = canvas.height / 2
            return {
                x: cx - qrSize / 2,
                y: cy - qrSize / 2,
                w: qrSize,
                h: qrSize
            }
        }

        window.addEventListener('load', async () => {
            const roomName = await initNetwork()

            // Generate QR
            const url = getQRUrl(roomName)
            console.log("[hormuz] Join URL:", url)
            const dataUrl = await QRCode.toDataURL(url, { width: 400, margin: 1 })
            qrImg = new Image()
            qrImg.src = dataUrl

            // Start host render loop
            requestAnimationFrame(hostRender)
        })

        function hostRender() {
            checkGameoverTimeout()

            if (gamePhase === PHASE_PLAYING) {
                // game.js handles rendering during play
                requestAnimationFrame(hostRender)
                return
            }

            if (gamePhase === PHASE_LOBBY) {
                ctx.fillStyle = "#1e293b"
                ctx.fillRect(0, 0, canvas.width, canvas.height)
                drawLobby()
            } else if (gamePhase === PHASE_SELECT) {
                ctx.fillStyle = "#1e293b"
                ctx.fillRect(0, 0, canvas.width, canvas.height)
                drawSelect()
            } else if (gamePhase === PHASE_GAMEOVER) {
                drawGameover()
            }

            requestAnimationFrame(hostRender)
        }

        function drawLobby() {
            const cx = canvas.width / 2
            const cy = canvas.height / 2

            // Initialize lobby objects on first frame
            initLobby()

            // Run physics + draw all objects (same as gameloop)
            handle_collisions()
            for (const obj of all_objects) {
                Object.values(obj.components).forEach(c => { if (c.draw) c.draw() })
            }
            handle_position_update()

            // Draw QR and title on top
            const qr = getQrRect()
            ctx.fillStyle = "#ffffff"
            ctx.fillRect(qr.x, qr.y, qr.w, qr.h)
            if (qrImg && qrImg.complete) {
                ctx.drawImage(qrImg, qr.x, qr.y, qr.w, qr.h)
            }

            ctx.fillStyle = "white"
            ctx.font = "bold 80px system-ui"
            ctx.textAlign = "center"
            ctx.fillText("SUPER MASH BRUDDAS", cx, 120)

            ctx.fillStyle = "#9ca3af"
            ctx.font = "36px system-ui"
            ctx.fillText("Scan to join", cx, qr.y + qr.h + 50)

            // Auto-advance to select when players connected
            if (connectedPeers.length > 0) {
                startSelectPhase()
            }
        }

        function drawSelect() {
            const cx = canvas.width / 2
            const cy = canvas.height / 2

            // Title
            ctx.fillStyle = "white"
            ctx.font = "bold 60px system-ui"
            ctx.textAlign = "center"
            ctx.fillText("SELECT CHARACTER", cx, 70)

            // Single character carousel - show all in a row
            const chars = character_names_list
            const cellW = 200
            const cellH = 240
            const totalW = chars.length * cellW
            const startX = cx - totalW / 2
            const startY = 120

            for (let i = 0; i < chars.length; i++) {
                const x = startX + i * cellW
                const y = startY

                // Cell background
                ctx.fillStyle = "#0f172a"
                ctx.strokeStyle = "#293244"
                ctx.lineWidth = 2
                ctx.beginPath()
                ctx.roundRect(x + 8, y, cellW - 16, cellH, 10)
                ctx.fill()
                ctx.stroke()

                // Character image
                const img = charImages[chars[i]]
                if (img && img.complete) {
                    ctx.drawImage(img, x + 30, y + 15, cellW - 60, cellH - 70)
                }

                // Name
                ctx.fillStyle = "#9ca3af"
                ctx.font = "18px system-ui"
                ctx.fillText(chars[i].toUpperCase(), x + cellW / 2, y + cellH - 15)

                // Player cursors on this character
                let playersHere = []
                for (let p = 0; p < connectedPeers.length; p++) {
                    if (connectedPeers[p].selectedChar === chars[i]) {
                        playersHere.push(p)
                    }
                }

                if (playersHere.length > 0) {
                    const cursorY = y + cellH + 20
                    const colors = ["#3b82f6", "#ef4444", "#22c55e", "#eab308"]
                    for (let pi = 0; pi < playersHere.length; pi++) {
                        const p = playersHere[pi]
                        const locked = connectedPeers[p].locked
                        const color = colors[p % colors.length]
                        const offsetX = (pi - (playersHere.length - 1) / 2) * 50

                        // Cursor triangle
                        const triX = x + cellW / 2 + offsetX
                        ctx.beginPath()
                        ctx.moveTo(triX, cursorY - 15)
                        ctx.lineTo(triX - 12, cursorY)
                        ctx.lineTo(triX + 12, cursorY)
                        ctx.closePath()
                        ctx.fillStyle = color
                        ctx.fill()

                        // Label
                        ctx.font = locked ? "bold 20px system-ui" : "20px system-ui"
                        ctx.fillStyle = color
                        ctx.fillText(locked ? `P${p + 1} ✓` : `P${p + 1}`, triX, cursorY + 22)
                    }
                }
            }

            // QR code (same size, centered, below carousel and cursors)
            if (qrImg && qrImg.complete) {
                const qrSize = 300
                const qrY = startY + cellH + 80
                const qrX = cx - qrSize / 2
                ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize)
                ctx.fillStyle = "#64748b"
                ctx.font = "20px system-ui"
                ctx.fillText("Scan to start", cx, qrY + qrSize + 30)
            }

            // Status
            ctx.fillStyle = "#22c55e"
            ctx.font = "28px system-ui"
            ctx.textAlign = "center"
            const allLocked = connectedPeers.length > 0 && connectedPeers.every(p => p.locked)
            const statusText = allLocked && connectedPeers.length >= 2 ? "Starting..." : `${connectedPeers.length} player(s) connected`
            ctx.fillText(statusText, cx, canvas.height - 30)
        }

        function drawGameover() {
            const cx = canvas.width / 2
            const bannerHeight = 150

            ctx.fillStyle = "rgba(0, 0, 0, 0.85)"
            ctx.fillRect(0, 0, canvas.width, bannerHeight)

            ctx.fillStyle = "white"
            ctx.font = "bold 90px system-ui"
            ctx.textAlign = "center"
            ctx.textBaseline = "middle"
            ctx.fillText(`P${winnerPlayerNum}: ${(winnerName || "???").toUpperCase()} WINS!`, cx, bannerHeight / 2)

            const elapsed = performance.now() - gameoverTimer
            const remaining = Math.max(0, Math.ceil((GAMEOVER_DURATION - elapsed) / 1000))
            ctx.fillStyle = "#9ca3af"
            ctx.font = "36px system-ui"
            ctx.fillText(`${remaining}`, cx, bannerHeight + 40)
        }
    </script>
</body>
