<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080b12;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    const canvas = document.getElementById("c")
    const ctx = canvas.getContext("2d")

    // === STATE ===
    let isPortrait = window.innerHeight > window.innerWidth

    function updateOrientation() {
      isPortrait = window.innerHeight > window.innerWidth
    }

    // Transform touch coords to logical landscape canvas space
    function transformTouch(clientX, clientY) {
      if (isPortrait) {
        return { x: clientY, y: window.innerWidth - clientX }
      }
      return { x: clientX, y: clientY }
    }

    // Logical landscape dimensions (used by all drawing/layout code)
    function logicalWidth() { return isPortrait ? window.innerHeight : window.innerWidth }
    function logicalHeight() { return isPortrait ? window.innerWidth : window.innerHeight }

    function resize() {
      updateOrientation()
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight
    }
    window.addEventListener("resize", resize)
    resize()

    let phase = "lobby" // lobby, select, playing, gameover
    let characters = []
    let selectedIndex = 0
    let locked = false
    let status = "Connecting..."
    let gestureLabels = { up: "ATK 1", left: "ATK 2", right: "ATK 3", down: "ATK 4", hold: "ATK 5" }
    let playerNum = 0
    let phoneGameoverStart = 0

    // === INPUT STATE (game phase) ===
    let input = { dx: 0, dy: 0, jump: false, b0: false, b1: false, b2: false, b3: false, b4: false }
    let joystickKnob = { x: 0, y: 0 }
    let joystickTouch = null

    // Gesture state
    const SWIPE_THRESHOLD = 30
    const TAP_TIME = 200
    const HOLD_TIME = 300
    let gestureTouch = null
    let gestureStart = null
    let gestureTriggered = false
    let holdActive = false

    // Floaters
    const floaters = []
    const FLOAT_DURATION = 800
    const FLOAT_RISE = 60
    let pendingClears = []

    // Character data (loaded from host via network)
    // charData = { trump: { trump: 'images/trump.png' }, faceman: { faceman: '...', faceman_shaman: '...' }, ... }
    let charData = {}
    const charImages = {}

    // === SELECT PHASE TOUCH ===
    let selectTouch = null
    let selectStartX = 0
    let selectStartY = 0
    let selectedSkinIndex = 0
    let selectHoldTimer = null

    function getSkinsForChar() {
      const charName = characters[selectedIndex]
      if (!charData[charName]) return []
      return Object.keys(charData[charName])
    }

    function handleSelectTouch(e) {
      if (e.type === "touchstart") {
        const touch = e.changedTouches[0]
        const pos = transformTouch(touch.clientX, touch.clientY)
        selectTouch = touch.identifier
        selectStartX = pos.x
        selectStartY = pos.y

        // Start hold timer for unlock
        if (locked) {
          selectHoldTimer = setTimeout(() => {
            locked = false
            sendSelectMsg({ type: "unlock", char: characters[selectedIndex], skin: getSkinsForChar()[selectedSkinIndex] })
            selectHoldTimer = null
          }, 500)
        }
      } else if (e.type === "touchend") {
        // Cancel hold timer
        if (selectHoldTimer) {
          clearTimeout(selectHoldTimer)
          selectHoldTimer = null
        }

        if (locked) return

        for (const t of e.changedTouches) {
          if (t.identifier === selectTouch) {
            const pos = transformTouch(t.clientX, t.clientY)
            const dx = pos.x - selectStartX
            const dy = pos.y - selectStartY
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
              // Horizontal swipe — change character
              if (dx < 0) selectedIndex = (selectedIndex + 1) % characters.length
              else selectedIndex = (selectedIndex - 1 + characters.length) % characters.length
              selectedSkinIndex = 0
              sendSelectMsg({ type: "browse", char: characters[selectedIndex], skin: getSkinsForChar()[0] })
            } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40) {
              // Vertical swipe — change skin
              const skins = getSkinsForChar()
              if (skins.length > 1) {
                if (dy < 0) selectedSkinIndex = (selectedSkinIndex + 1) % skins.length
                else selectedSkinIndex = (selectedSkinIndex - 1 + skins.length) % skins.length
                sendSelectMsg({ type: "browse", char: characters[selectedIndex], skin: skins[selectedSkinIndex] })
              }
            } else {
              // Tap = lock in
              locked = true
              const skins = getSkinsForChar()
              sendSelectMsg({ type: "lock", char: characters[selectedIndex], skin: skins[selectedSkinIndex] })
            }
            selectTouch = null
          }
        }
      }
    }

    // === GAME PHASE TOUCH ===
    function isLeftHalf(x) { return x < logicalWidth() / 2 }

    function handleGameTouch(e) {
      if (e.type === "touchstart") {
        e.preventDefault()
        for (const touch of e.changedTouches) {
          const pos = transformTouch(touch.clientX, touch.clientY)
          if (isLeftHalf(pos.x) && joystickTouch === null) {
            joystickTouch = touch.identifier
            updateJoystick(pos.x, pos.y)
          } else if (!isLeftHalf(pos.x) && gestureTouch === null) {
            gestureTouch = touch.identifier
            gestureStart = { x: pos.x, y: pos.y, time: performance.now() }
            gestureTriggered = false
            holdActive = false
          }
        }
      } else if (e.type === "touchmove") {
        e.preventDefault()
        for (const touch of e.changedTouches) {
          const pos = transformTouch(touch.clientX, touch.clientY)
          if (touch.identifier === joystickTouch) {
            updateJoystick(pos.x, pos.y)
          } else if (touch.identifier === gestureTouch && gestureStart && !gestureTriggered) {
            const dx = pos.x - gestureStart.x
            const dy = pos.y - gestureStart.y
            if (Math.hypot(dx, dy) > SWIPE_THRESHOLD) {
              if (Math.abs(dx) > Math.abs(dy)) triggerGesture(dx > 0 ? "right" : "left")
              else triggerGesture(dy > 0 ? "down" : "up")
              gestureTriggered = true
            }
          }
        }
      } else if (e.type === "touchend" || e.type === "touchcancel") {
        for (const touch of e.changedTouches) {
          if (touch.identifier === joystickTouch) {
            joystickTouch = null
            joystickKnob = { x: 0, y: 0 }
            input.dx = 0; input.dy = 0
          } else if (touch.identifier === gestureTouch) {
            if (!gestureTriggered && gestureStart) {
              const elapsed = performance.now() - gestureStart.time
              if (elapsed < TAP_TIME) triggerGesture("tap")
            }
            gestureTouch = null
            gestureStart = null
            if (holdActive) { input.b4 = false; holdActive = false }
          }
        }
      }
    }

    function updateJoystick(cx, cy) {
      const centerX = logicalWidth() * 0.22
      const centerY = logicalHeight() * 0.5
      const maxDist = Math.min(logicalWidth(), logicalHeight()) * 0.13
      let dx = cx - centerX
      let dy = cy - centerY
      const dist = Math.hypot(dx, dy)
      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist }
      joystickKnob = { x: dx, y: dy }
      input.dx = dx / maxDist
      input.dy = dy / maxDist
    }

    function spawnFloater(type) {
      const gCx = logicalWidth() * 0.75
      const gCy = logicalHeight() * 0.5
      const jitter = (Math.random() - 0.5) * 40
      let text, color
      switch (type) {
        case "tap": text = "JUMP"; color = "#22c55e"; break
        case "hold": text = gestureLabels.hold || "ATK 5"; color = "#a855f7"; break
        case "up": text = gestureLabels.up || "↑"; color = "#3b82f6"; break
        case "down": text = gestureLabels.down || "↓"; color = "#3b82f6"; break
        case "left": text = gestureLabels.left || "←"; color = "#3b82f6"; break
        case "right": text = gestureLabels.right || "→"; color = "#3b82f6"; break
        default: text = type; color = "#3b82f6"
      }
      floaters.push({ text, color, x: gCx + jitter, y: gCy + (Math.random() - 0.5) * 30, born: performance.now() })
    }

    function triggerGesture(type) {
      spawnFloater(type)
      if (type === "tap") { input.jump = true; pendingClears.push("jump") }
      else if (type === "up") { input.b0 = true; pendingClears.push("b0") }
      else if (type === "left") { input.b1 = true; pendingClears.push("b1") }
      else if (type === "right") { input.b2 = true; pendingClears.push("b2") }
      else if (type === "down") { input.b3 = true; pendingClears.push("b3") }
    }

    function checkHold() {
      if (gestureTouch !== null && gestureStart && !gestureTriggered && !holdActive) {
        if (performance.now() - gestureStart.time > HOLD_TIME) {
          holdActive = true
          input.b4 = true
          spawnFloater("hold")
        }
      }
    }

    // === UNIFIED TOUCH DISPATCHER ===
    for (const evt of ["touchstart", "touchmove", "touchend", "touchcancel"]) {
      canvas.addEventListener(evt, e => {
        e.preventDefault()
        if (phase === "select") handleSelectTouch(e)
        else if (phase === "playing") handleGameTouch(e)
      }, { passive: false })
    }

    // === RENDERING ===
    function draw() {
      resize()
      const now = performance.now()
      const w = logicalWidth()
      const h = logicalHeight()

      ctx.save()
      if (isPortrait) {
        // Rotate context so we draw in landscape within the portrait canvas
        ctx.translate(canvas.width, 0)
        ctx.rotate(Math.PI / 2)
      }

      ctx.fillStyle = "#080b12"
      ctx.fillRect(0, 0, w, h)

      if (phase === "lobby") drawLobby()
      else if (phase === "select") drawSelectScreen()
      else if (phase === "playing") { checkHold(); drawGameControls(now) }
      else if (phase === "gameover") drawGameoverScreen()

      ctx.restore()
      requestAnimationFrame(draw)
    }

    function drawLobby() {
      ctx.fillStyle = "#9ca3af"
      ctx.font = `${logicalHeight() * 0.05}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillText(status, logicalWidth() / 2, logicalHeight() / 2)
    }

    function drawSelectScreen() {
      const w = logicalWidth(), h = logicalHeight()
      const cx = w / 2, cy = h * 0.52

      const charName = characters[selectedIndex] || "???"
      const skins = getSkinsForChar()
      const skinName = skins[selectedSkinIndex] || charName

      // Main character/skin image — constrain so it doesn't overlap name or instructions
      const img = charImages[skinName] || charImages[charName]
      const imgSize = Math.min(w * 0.3, h * 0.5)
      if (img && img.complete) {
        ctx.drawImage(img, cx - imgSize / 2, cy - imgSize / 2, imgSize, imgSize)
      }

      if (!locked) {
        // Left/right neighbor characters (small, faded)
        const smallSize = imgSize * 0.35
        ctx.globalAlpha = 0.4
        const prevIndex = (selectedIndex - 1 + characters.length) % characters.length
        const nextIndex = (selectedIndex + 1) % characters.length
        const prevChar = characters[prevIndex]
        const nextChar = characters[nextIndex]
        const prevImg = charImages[Object.keys(charData[prevChar] || {})[0]] || charImages[prevChar]
        const nextImg = charImages[Object.keys(charData[nextChar] || {})[0]] || charImages[nextChar]
        if (prevImg && prevImg.complete) {
          ctx.drawImage(prevImg, cx - imgSize / 2 - smallSize - 15, cy - smallSize / 2, smallSize, smallSize)
        }
        if (nextImg && nextImg.complete) {
          ctx.drawImage(nextImg, cx + imgSize / 2 + 15, cy - smallSize / 2, smallSize, smallSize)
        }

        // Above/below skin previews
        if (skins.length > 1) {
          const prevSkinIndex = (selectedSkinIndex - 1 + skins.length) % skins.length
          const nextSkinIndex = (selectedSkinIndex + 1) % skins.length
          const prevSkinImg = charImages[skins[prevSkinIndex]]
          const nextSkinImg = charImages[skins[nextSkinIndex]]
          if (prevSkinImg && prevSkinImg.complete) {
            ctx.drawImage(prevSkinImg, cx - smallSize / 2, cy - imgSize / 2 - smallSize - 10, smallSize, smallSize)
          }
          if (nextSkinImg && nextSkinImg.complete) {
            ctx.drawImage(nextSkinImg, cx - smallSize / 2, cy + imgSize / 2 + 10, smallSize, smallSize)
          }
        }
        ctx.globalAlpha = 1
      }

      // Character name
      ctx.fillStyle = "white"
      ctx.font = `bold ${Math.min(h * 0.07, w * 0.04)}px system-ui`
      ctx.textAlign = "left"
      ctx.textBaseline = "middle"
      ctx.fillText(charName.toUpperCase(), w * 0.03, h * 0.06)

      // Skin name (if multiple skins)
      if (skins.length > 1) {
        ctx.fillStyle = "#64748b"
        ctx.font = `${Math.min(h * 0.035, w * 0.02)}px system-ui`
        ctx.textAlign = "left"
        ctx.fillText(skinName, w * 0.03, h * 0.12)
      }

      // Instructions
      ctx.fillStyle = locked ? "#22c55e" : "#9ca3af"
      ctx.font = `${Math.min(h * 0.04, w * 0.022)}px system-ui`
      ctx.textAlign = "right"
      const msg = locked ? "✓ LOCKED IN (hold to unlock)" : "← → character • ↑ ↓ skin • tap to lock"
      ctx.fillText(msg, w - w * 0.03, h * 0.95)
    }

    function drawGameControls(now) {
      const w = logicalWidth(), h = logicalHeight()

      // Player number
      ctx.fillStyle = "white"
      ctx.font = `bold ${h * 0.05}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "top"
      ctx.fillText(`P${playerNum}`, w / 2, 10)

      // Divider
      ctx.strokeStyle = "#1e293b"
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(w / 2, 0)
      ctx.lineTo(w / 2, h)
      ctx.stroke()

      // Joystick
      const jCx = w * 0.22, jCy = h * 0.5
      const jR = Math.min(w, h) * 0.18

      ctx.beginPath()
      ctx.arc(jCx, jCy, jR, 0, Math.PI * 2)
      ctx.fillStyle = "#1e293b"
      ctx.fill()
      ctx.strokeStyle = "#334155"
      ctx.lineWidth = 2
      ctx.stroke()

      const knobR = jR * 0.38
      ctx.beginPath()
      ctx.arc(jCx + joystickKnob.x, jCy + joystickKnob.y, knobR, 0, Math.PI * 2)
      ctx.fillStyle = joystickTouch !== null ? "#3b82f6" : "#1d4ed8"
      ctx.fill()
      if (joystickTouch !== null) {
        ctx.shadowColor = "#3b82f6"; ctx.shadowBlur = 20; ctx.fill(); ctx.shadowBlur = 0
      }

      // Gesture area hint
      const gCx = w * 0.75, gCy = h * 0.5
      ctx.fillStyle = "#1e293b22"
      ctx.beginPath()
      ctx.arc(gCx, gCy, Math.min(w * 0.2, h * 0.35), 0, Math.PI * 2)
      ctx.fill()

      ctx.fillStyle = "#334155"
      ctx.font = `${h * 0.025}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillText("swipe / tap", gCx, gCy + Math.min(w * 0.2, h * 0.35) + h * 0.04)

      // Floaters
      const fontSize = Math.round(h * 0.08)
      ctx.font = `bold ${fontSize}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"

      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i]
        const age = now - f.born
        if (age > FLOAT_DURATION) { floaters.splice(i, 1); continue }
        const t = age / FLOAT_DURATION
        ctx.globalAlpha = 1 - t
        ctx.fillStyle = f.color
        ctx.fillText(f.text, f.x, f.y - t * FLOAT_RISE)
        ctx.globalAlpha = 1
      }
    }

    function drawGameoverScreen() {
      ctx.fillStyle = "#9ca3af"
      ctx.font = `${logicalHeight() * 0.06}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillText("Waiting for next round...", logicalWidth() / 2, logicalHeight() / 2)
    }

    requestAnimationFrame(draw)

    // === NETWORKING ===
    const params = new URLSearchParams(window.location.search)
    const roomName = params.get("room")
    let sendInput = null
    let sendSelectMsg = () => {}

    if (!roomName) {
      status = "No room. Scan QR to join."
    } else {
      startController(roomName)
    }

    async function startController(roomName) {
      const { joinRoom } = await import("https://esm.run/trystero@0.24.0")

      const room = joinRoom({ appId: "supermashbruddas-phone" }, roomName)
      const [_sendInput, _receiveInput] = room.makeAction("input")
      const [_sendPhase, receivePhase] = room.makeAction("phase")
      const [_sendCharInfo, receiveCharInfo] = room.makeAction("charinfo")
      const [_sendCharList, receiveCharList] = room.makeAction("charlist")
      const [_sendSelect, _receiveSelect] = room.makeAction("select")

      sendInput = _sendInput
      sendSelectMsg = _sendSelect
      _receiveInput(() => {})
      _receiveSelect(() => {})

      receivePhase((data) => {
        phase = data.phase
        if (phase === "select") {
          locked = false
          selectedIndex = 0
        }
        if (phase === "playing") {
          // Reset all input state so nothing is stuck from previous round
          input = { dx: 0, dy: 0, jump: false, b0: false, b1: false, b2: false, b3: false, b4: false }
          joystickKnob = { x: 0, y: 0 }
          joystickTouch = null
          gestureTouch = null
          gestureStart = null
          gestureTriggered = false
          holdActive = false
          pendingClears.length = 0
        }
        if (phase === "gameover") {
          phoneGameoverStart = performance.now()
        }
      })

      receiveCharInfo((data) => {
        if (data.labels) gestureLabels = data.labels
        if (data.phase) phase = data.phase
        if (data.playerNum) playerNum = data.playerNum
      })

      receiveCharList((data) => {
        if (data.characters) {
          characters = data.characters
          selectedIndex = 0
          selectedSkinIndex = 0
        }
        if (data.charData) {
          charData = data.charData
          for (const [charName, skins] of Object.entries(charData)) {
            for (const [skinName, src] of Object.entries(skins)) {
              if (!charImages[skinName]) {
                const img = new Image()
                img.src = src
                charImages[skinName] = img
              }
            }
          }
        }
      })

      room.onPeerJoin(() => { status = "Connected ✓" })
      room.onPeerLeave(() => { status = "Host disconnected" })

      // Send game input at 30Hz
      setInterval(() => {
        if (phase === "playing" && sendInput) {
          sendInput({ ...input })
          for (const key of pendingClears) input[key] = false
          pendingClears.length = 0
        }
      }, 33)
    }
  </script>
</body>
</html>
