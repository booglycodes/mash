<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080b12;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    const canvas = document.getElementById("c")
    const ctx = canvas.getContext("2d")

    // === STATE ===
    let isPortrait = window.innerHeight > window.innerWidth

    function updateOrientation() {
      isPortrait = window.innerHeight > window.innerWidth
    }

    // Transform touch coords to logical landscape canvas space
    function transformTouch(clientX, clientY) {
      if (isPortrait) {
        return { x: clientY, y: window.innerWidth - clientX }
      }
      return { x: clientX, y: clientY }
    }

    // Logical landscape dimensions (used by all drawing/layout code)
    function logicalWidth() { return isPortrait ? window.innerHeight : window.innerWidth }
    function logicalHeight() { return isPortrait ? window.innerWidth : window.innerHeight }

    function resize() {
      updateOrientation()
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight
    }
    window.addEventListener("resize", resize)
    resize()

    let phase = "lobby" // lobby, select, playing, gameover
    let characters = []
    let selectedIndex = 0
    let locked = false
    let status = "Connecting..."
    let playerNum = 0
    let phoneGameoverStart = 0
    let abilityLabels = {} // { up, down, left, right, hold, holdswipe }

    // === INPUT STATE (game phase) ===
    // Raw touch data — no gesture interpretation, game side decides what it means
    let input = {
      dx: 0, dy: 0,                         // joystick axes (-1 to 1)
      touching: false,                       // right side currently touched
      rx: 0, ry: 0,                          // current touch position (normalized 0-1 within right half)
      startX: 0, startY: 0,                  // where the touch began (normalized)
      startTime: 0                           // when the touch began (ms timestamp)
    }
    let joystickKnob = { x: 0, y: 0 }
    let joystickTouch = null
    let rightTouch = null

    // Touch trails — dot at start, line+dot at end, fades after release
    const touchTrails = []
    const TRAIL_FADE_DURATION = 400

    // Character data (loaded from host via network)
    // charData = { trump: { trump: 'images/trump.png' }, faceman: { faceman: '...', faceman_shaman: '...' }, ... }
    let charData = {}
    const charImages = {}

    // === SELECT PHASE TOUCH ===
    let selectTouch = null
    let selectStartX = 0
    let selectStartY = 0
    let selectedSkinIndex = 0

    // Select screen animations
    let selectFadeInStart = 0
    let lockAnimStart = 0
    let unlockAnimStart = 0
    const FADE_IN_DURATION = 400
    const LOCK_ANIM_DURATION = 600
    const VIBRATE_DURATION = 400
    const UNLOCK_ANIM_DURATION = 300

    function getSkinsForChar() {
      const charName = characters[selectedIndex]
      if (!charData[charName]) return []
      return Object.keys(charData[charName])
    }

    function handleSelectTouch(e) {
      if (e.type === "touchstart") {
        const touch = e.changedTouches[0]
        const pos = transformTouch(touch.clientX, touch.clientY)
        selectTouch = touch.identifier
        selectStartX = pos.x
        selectStartY = pos.y
      } else if (e.type === "touchend") {
        if (locked) {
          // Swipe up to unlock
          for (const t of e.changedTouches) {
            if (t.identifier === selectTouch) {
              const pos = transformTouch(t.clientX, t.clientY)
              const dy = pos.y - selectStartY
              if (dy < -40) {
                locked = false
                unlockAnimStart = performance.now()
                sendSelectMsg({ type: "unlock", char: characters[selectedIndex], skin: getSkinsForChar()[selectedSkinIndex] })
              }
              selectTouch = null
            }
          }
          return
        }

        for (const t of e.changedTouches) {
          if (t.identifier === selectTouch) {
            const pos = transformTouch(t.clientX, t.clientY)
            const dx = pos.x - selectStartX
            const dy = pos.y - selectStartY
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
              // Horizontal swipe — change character
              if (dx < 0) selectedIndex = (selectedIndex + 1) % characters.length
              else selectedIndex = (selectedIndex - 1 + characters.length) % characters.length
              selectedSkinIndex = 0
              sendSelectMsg({ type: "browse", char: characters[selectedIndex], skin: getSkinsForChar()[0] })
            } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40) {
              // Vertical swipe — change skin
              const skins = getSkinsForChar()
              if (skins.length > 1) {
                if (dy < 0) selectedSkinIndex = (selectedSkinIndex + 1) % skins.length
                else selectedSkinIndex = (selectedSkinIndex - 1 + skins.length) % skins.length
                sendSelectMsg({ type: "browse", char: characters[selectedIndex], skin: skins[selectedSkinIndex] })
              }
            } else {
              // Tap = lock in
              locked = true
              lockAnimStart = performance.now()
              const skins = getSkinsForChar()
              sendSelectMsg({ type: "lock", char: characters[selectedIndex], skin: skins[selectedSkinIndex] })
            }
            selectTouch = null
          }
        }
      }
    }

    // === GAME PHASE TOUCH ===
    function isLeftHalf(x) { return x < logicalWidth() / 2 }

    function handleGameTouch(e) {
      if (e.type === "touchstart") {
        e.preventDefault()
        for (const touch of e.changedTouches) {
          const pos = transformTouch(touch.clientX, touch.clientY)
          if (isLeftHalf(pos.x) && joystickTouch === null) {
            joystickTouch = touch.identifier
            updateJoystick(pos.x, pos.y)
          } else if (!isLeftHalf(pos.x) && rightTouch === null) {
            rightTouch = touch.identifier
            const nx = (pos.x - logicalWidth() / 2) / (logicalWidth() / 2)
            const ny = pos.y / logicalHeight()
            input.touching = true
            input.rx = nx; input.ry = ny
            input.startX = nx; input.startY = ny
            input.startTime = performance.now()
            // Start a new trail
            touchTrails.push({ startX: pos.x, startY: pos.y, endX: pos.x, endY: pos.y, born: 0, released: false })
          }
        }
      } else if (e.type === "touchmove") {
        e.preventDefault()
        for (const touch of e.changedTouches) {
          const pos = transformTouch(touch.clientX, touch.clientY)
          if (touch.identifier === joystickTouch) {
            updateJoystick(pos.x, pos.y)
          } else if (touch.identifier === rightTouch) {
            const nx = (pos.x - logicalWidth() / 2) / (logicalWidth() / 2)
            const ny = pos.y / logicalHeight()
            input.rx = nx; input.ry = ny
            // Update active trail endpoint
            const active = touchTrails[touchTrails.length - 1]
            if (active && !active.released) {
              active.endX = pos.x; active.endY = pos.y
            }
          }
        }
      } else if (e.type === "touchend" || e.type === "touchcancel") {
        for (const touch of e.changedTouches) {
          if (touch.identifier === joystickTouch) {
            joystickTouch = null
            joystickKnob = { x: 0, y: 0 }
            input.dx = 0; input.dy = 0
          } else if (touch.identifier === rightTouch) {
            input.touching = false
            rightTouch = null
            // Mark trail as released so it fades out
            const active = touchTrails[touchTrails.length - 1]
            if (active && !active.released) {
              active.released = true
              active.born = performance.now()
            }
          }
        }
      }
    }

    function updateJoystick(cx, cy) {
      const centerX = logicalWidth() * 0.22
      const centerY = logicalHeight() * 0.5
      const maxDist = Math.min(logicalWidth(), logicalHeight()) * 0.13
      let dx = cx - centerX
      let dy = cy - centerY
      const dist = Math.hypot(dx, dy)
      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist }
      joystickKnob = { x: dx, y: dy }
      input.dx = dx / maxDist
      input.dy = dy / maxDist
    }

    // (touch trail rendering is in drawGameControls)

    // === UNIFIED TOUCH DISPATCHER ===
    for (const evt of ["touchstart", "touchmove", "touchend", "touchcancel"]) {
      canvas.addEventListener(evt, e => {
        e.preventDefault()
        if (phase === "select") handleSelectTouch(e)
        else if (phase === "playing") handleGameTouch(e)
      }, { passive: false })
    }

    // === RENDERING ===
    function draw() {
      resize()
      const now = performance.now()
      const w = logicalWidth()
      const h = logicalHeight()

      ctx.save()
      if (isPortrait) {
        // Rotate context so we draw in landscape within the portrait canvas
        ctx.translate(canvas.width, 0)
        ctx.rotate(Math.PI / 2)
      }

      ctx.fillStyle = "#080b12"
      ctx.fillRect(0, 0, w, h)

      if (phase === "lobby") drawLobby()
      else if (phase === "select") drawSelectScreen()
      else if (phase === "playing") { drawGameControls(now) }
      else if (phase === "gameover") drawGameoverScreen()

      ctx.restore()
      requestAnimationFrame(draw)
    }

    function drawLobby() {
      ctx.fillStyle = "#9ca3af"
      ctx.font = `${logicalHeight() * 0.05}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillText(status, logicalWidth() / 2, logicalHeight() / 2)
    }

    function drawSelectScreen() {
      const now = performance.now()
      const w = logicalWidth(), h = logicalHeight()
      const cx = w / 2, cy = h * 0.52

      // Fade in
      const fadeAge = now - selectFadeInStart
      const fadeAlpha = selectFadeInStart ? Math.min(1, fadeAge / FADE_IN_DURATION) : 1

      // Lock animation progress
      const lockAge = now - lockAnimStart
      const lockT = lockAnimStart ? Math.min(1, lockAge / LOCK_ANIM_DURATION) : 1
      const vibrateT = lockAnimStart ? Math.max(0, Math.min(1, (lockAge - LOCK_ANIM_DURATION * 0.3) / VIBRATE_DURATION)) : 1

      // Unlock animation progress
      const unlockAge = now - unlockAnimStart
      const unlockT = unlockAnimStart ? Math.min(1, unlockAge / UNLOCK_ANIM_DURATION) : 1

      // Easing
      const easeOut = t => 1 - Math.pow(1 - t, 3)
      const slideIn = locked ? easeOut(lockT) : (unlockAnimStart && unlockT < 1 ? 1 - easeOut(unlockT) : 0)

      // Vibrate offset for character when locking
      let vibrateX = 0
      if (locked && vibrateT < 1) {
        vibrateX = Math.sin(vibrateT * Math.PI * 8) * (1 - vibrateT) * 6
      }

      ctx.globalAlpha = fadeAlpha

      const charName = characters[selectedIndex] || "???"
      const skins = getSkinsForChar()
      const skinName = skins[selectedSkinIndex] || charName

      // Main character/skin image
      const img = charImages[skinName] || charImages[charName]
      const imgSize = Math.min(w * 0.3, h * 0.5)
      if (img && img.complete) {
        ctx.drawImage(img, cx - imgSize / 2 + vibrateX, cy - imgSize / 2, imgSize, imgSize)
      }

      if (!locked) {
        // Fade out neighbors during unlock
        const neighborAlpha = unlockAnimStart && unlockT < 1 ? easeOut(unlockT) : 1

        // Left/right neighbor characters (small, faded)
        const smallSize = imgSize * 0.35
        ctx.globalAlpha = fadeAlpha * 0.4 * neighborAlpha
        const prevIndex = (selectedIndex - 1 + characters.length) % characters.length
        const nextIndex = (selectedIndex + 1) % characters.length
        const prevChar = characters[prevIndex]
        const nextChar = characters[nextIndex]
        const prevImg = charImages[Object.keys(charData[prevChar] || {})[0]] || charImages[prevChar]
        const nextImg = charImages[Object.keys(charData[nextChar] || {})[0]] || charImages[nextChar]
        if (prevImg && prevImg.complete) {
          ctx.drawImage(prevImg, cx - imgSize / 2 - smallSize - 15, cy - smallSize / 2, smallSize, smallSize)
        }
        if (nextImg && nextImg.complete) {
          ctx.drawImage(nextImg, cx + imgSize / 2 + 15, cy - smallSize / 2, smallSize, smallSize)
        }

        // Above/below skin previews
        if (skins.length > 1) {
          const prevSkinIndex = (selectedSkinIndex - 1 + skins.length) % skins.length
          const nextSkinIndex = (selectedSkinIndex + 1) % skins.length
          const prevSkinImg = charImages[skins[prevSkinIndex]]
          const nextSkinImg = charImages[skins[nextSkinIndex]]
          if (prevSkinImg && prevSkinImg.complete) {
            ctx.drawImage(prevSkinImg, cx - smallSize / 2, cy - imgSize / 2 - smallSize - 10, smallSize, smallSize)
          }
          if (nextSkinImg && nextSkinImg.complete) {
            ctx.drawImage(nextSkinImg, cx - smallSize / 2, cy + imgSize / 2 + 10, smallSize, smallSize)
          }
        }
        ctx.globalAlpha = fadeAlpha
      }

      // Character name — slides in from left when locking
      const nameSlideOffset = locked ? (1 - easeOut(lockT)) * -w * 0.3 : 0
      ctx.fillStyle = "white"
      ctx.font = `bold ${Math.min(h * 0.09, w * 0.05)}px system-ui`
      ctx.textAlign = locked ? "center" : "left"
      ctx.textBaseline = "middle"
      ctx.fillText(charName.toUpperCase(), (locked ? cx : w * 0.03) + nameSlideOffset, h * 0.06)

      // Skin name (if multiple skins)
      if (skins.length > 1) {
        ctx.fillStyle = "#64748b"
        ctx.font = `${Math.min(h * 0.05, w * 0.028)}px system-ui`
        ctx.textAlign = locked ? "center" : "left"
        ctx.fillText(skinName, (locked ? cx : w * 0.03) + nameSlideOffset, h * 0.12)
      }

      // Instructions — slides in from bottom when locking
      const instrSlideOffset = locked ? (1 - easeOut(lockT)) * h * 0.2 : 0
      ctx.fillStyle = locked ? "#22c55e" : "#9ca3af"
      if (locked) {
        ctx.globalAlpha = fadeAlpha * easeOut(lockT)
        ctx.font = `${Math.min(h * 0.06, w * 0.035)}px system-ui`
        ctx.textAlign = "center"
        ctx.fillText("✓ LOCKED IN (swipe up to unlock)", cx, h * 0.95 + instrSlideOffset)
      } else {
        ctx.font = `${Math.min(h * 0.04, w * 0.022)}px system-ui`
        ctx.textAlign = "right"
        ctx.fillText("← → character • ↑ ↓ skin • tap to lock", w - w * 0.03, h * 0.95)
      }

      ctx.globalAlpha = 1
    }

    function drawGameControls(now) {
      const w = logicalWidth(), h = logicalHeight()

      // Player number
      ctx.fillStyle = "white"
      ctx.font = `bold ${h * 0.05}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "top"
      ctx.fillText(`P${playerNum}`, w / 2, 10)

      // Divider
      ctx.strokeStyle = "#1e293b"
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(w / 2, 0)
      ctx.lineTo(w / 2, h)
      ctx.stroke()

      // Joystick
      const jCx = w * 0.22, jCy = h * 0.5
      const jR = Math.min(w, h) * 0.18

      ctx.beginPath()
      ctx.arc(jCx, jCy, jR, 0, Math.PI * 2)
      ctx.fillStyle = "#1e293b"
      ctx.fill()
      ctx.strokeStyle = "#334155"
      ctx.lineWidth = 2
      ctx.stroke()

      const knobR = jR * 0.38
      ctx.beginPath()
      ctx.arc(jCx + joystickKnob.x, jCy + joystickKnob.y, knobR, 0, Math.PI * 2)
      ctx.fillStyle = joystickTouch !== null ? "#3b82f6" : "#1d4ed8"
      ctx.fill()
      if (joystickTouch !== null) {
        ctx.shadowColor = "#3b82f6"; ctx.shadowBlur = 20; ctx.fill(); ctx.shadowBlur = 0
      }

      // Touch trails — draw active + fading
      const dotR = 8
      for (let i = touchTrails.length - 1; i >= 0; i--) {
        const t = touchTrails[i]
        let alpha = 1
        if (t.released) {
          const age = now - t.born
          if (age > TRAIL_FADE_DURATION) { touchTrails.splice(i, 1); continue }
          alpha = 1 - age / TRAIL_FADE_DURATION
        }
        ctx.globalAlpha = alpha

        // Start dot
        ctx.beginPath()
        ctx.arc(t.startX, t.startY, dotR, 0, Math.PI * 2)
        ctx.fillStyle = "#3b82f6"
        ctx.fill()

        // Line from start to end (if moved)
        const dist = Math.hypot(t.endX - t.startX, t.endY - t.startY)
        if (dist > 5) {
          ctx.beginPath()
          ctx.moveTo(t.startX, t.startY)
          ctx.lineTo(t.endX, t.endY)
          ctx.strokeStyle = "#3b82f6"
          ctx.lineWidth = 3
          ctx.stroke()

          // End dot
          ctx.beginPath()
          ctx.arc(t.endX, t.endY, dotR * 1.2, 0, Math.PI * 2)
          ctx.fillStyle = "#22c55e"
          ctx.fill()
        }
      }
      ctx.globalAlpha = 1

      // Ability guide — subtle labels around the gesture area
      const gCx = w * 0.75, gCy = h * 0.5
      const spread = Math.min(w * 0.18, h * 0.32)
      const labelSize = Math.round(h * 0.035)
      ctx.font = `${labelSize}px system-ui`
      ctx.textBaseline = "middle"
      ctx.fillStyle = "#475569"

      if (abilityLabels.up) {
        ctx.textAlign = "center"
        ctx.fillText("↑ " + abilityLabels.up, gCx, gCy - spread)
      }
      if (abilityLabels.down) {
        ctx.textAlign = "center"
        ctx.fillText("↓ " + abilityLabels.down, gCx, gCy + spread)
      }
      if (abilityLabels.left) {
        ctx.textAlign = "right"
        ctx.fillText(abilityLabels.left + " ←", gCx - spread * 0.7, gCy)
      }
      if (abilityLabels.right) {
        ctx.textAlign = "left"
        ctx.fillText("→ " + abilityLabels.right, gCx + spread * 0.7, gCy)
      }
      // Hold and holdswipe labels at bottom
      const bottomY = gCy + spread + labelSize * 1.5
      ctx.textAlign = "center"
      ctx.fillStyle = "#374151"
      ctx.font = `${Math.round(labelSize * 0.85)}px system-ui`
      let hints = []
      if (abilityLabels.hold) hints.push("hold: " + abilityLabels.hold)
      if (abilityLabels.holdswipe) hints.push("hold+swipe: " + abilityLabels.holdswipe)
      if (hints.length > 0) {
        ctx.fillText(hints.join("  •  "), gCx, bottomY)
      }
      ctx.fillText("tap: JUMP", gCx, bottomY + labelSize)
    }

    function drawGameoverScreen() {
      ctx.fillStyle = "#9ca3af"
      ctx.font = `${logicalHeight() * 0.06}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillText("Waiting for next round...", logicalWidth() / 2, logicalHeight() / 2)
    }

    requestAnimationFrame(draw)

    // === NETWORKING ===
    const params = new URLSearchParams(window.location.search)
    const roomName = params.get("room")
    let sendInput = null
    let sendSelectMsg = () => {}

    if (!roomName) {
      status = "No room. Scan QR to join."
    } else {
      startController(roomName)
    }

    async function startController(roomName) {
      const { joinRoom } = await import("https://esm.run/trystero@0.24.0")

      const room = joinRoom({ appId: "supermashbruddas-phone" }, roomName)
      const [_sendInput, _receiveInput] = room.makeAction("input")
      const [_sendPhase, receivePhase] = room.makeAction("phase")
      const [_sendCharInfo, receiveCharInfo] = room.makeAction("charinfo")
      const [_sendCharList, receiveCharList] = room.makeAction("charlist")
      const [_sendSelect, _receiveSelect] = room.makeAction("select")

      sendInput = _sendInput
      sendSelectMsg = _sendSelect
      _receiveInput(() => {})
      _receiveSelect(() => {})

      receivePhase((data) => {
        phase = data.phase
        if (phase === "select") {
          locked = false
          selectedIndex = 0
          selectFadeInStart = performance.now()
        }
        if (phase === "playing") {
          // Reset all input state so nothing is stuck from previous round
          input = { dx: 0, dy: 0, touching: false, rx: 0, ry: 0, startX: 0, startY: 0, startTime: 0 }
          joystickKnob = { x: 0, y: 0 }
          joystickTouch = null
          rightTouch = null
        }
        if (phase === "gameover") {
          phoneGameoverStart = performance.now()
        }
      })

      receiveCharInfo((data) => {
        if (data.phase) phase = data.phase
        if (data.playerNum) playerNum = data.playerNum
        if (data.labels) abilityLabels = data.labels
      })

      receiveCharList((data) => {
        if (data.characters) {
          characters = data.characters
          selectedIndex = 0
          selectedSkinIndex = 0
        }
        if (data.charData) {
          charData = data.charData
          for (const [charName, skins] of Object.entries(charData)) {
            for (const [skinName, src] of Object.entries(skins)) {
              if (!charImages[skinName]) {
                const img = new Image()
                img.src = src
                charImages[skinName] = img
              }
            }
          }
        }
      })

      room.onPeerJoin(() => { status = "Connected ✓" })
      room.onPeerLeave(() => { status = "Host disconnected" })

      // Send raw touch state at 30Hz
      setInterval(() => {
        if (phase === "playing" && sendInput) {
          sendInput({ ...input })
        }
      }, 33)
    }
  </script>
</body>
</html>
